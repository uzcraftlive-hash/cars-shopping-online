  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      min-height: 100vh;
      padding: 10px;
    }

    .wrapper { max-width: 1600px; margin: 0 auto; }

    .navbar {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      border-radius: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      position: sticky;
      top: 10px;
      z-index: 100;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .search-container {
      flex: 1;
      min-width: 200px;
      display: flex;
      gap: 8px;
    }

    .search-container input {
      flex: 1;
      padding: 10px 14px;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(100, 150, 200, 0.3);
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
    }

    .search-container input::placeholder { color: #64748b; }

    .search-container button {
      padding: 10px 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: 0.3s;
    }

    .search-container button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .cart-btn {
      position: relative;
      font-size: 24px;
      cursor: pointer;
      transition: 0.3s;
    }

    .cart-btn:hover { transform: scale(1.1); }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .filters-section {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(10px);
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      border: 1px solid rgba(100, 150, 200, 0.2);
    }

    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .filter-item label {
      font-size: 11px;
      text-transform: uppercase;
      color: #64b5f6;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .filter-item select, .filter-item input {
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(100, 150, 200, 0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .product-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(100, 150, 200, 0.2);
      transition: all 0.3s;
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: rgba(102, 126, 234, 0.5);
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.15);
    }

    .product-image {
      width: 100%;
      height: 150px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      position: relative;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 107, 107, 0.9);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
    }

    .product-body {
      padding: 12px;
    }

    .product-brand {
      font-size: 10px;
      color: #64b5f6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }

    .product-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-details {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .product-specs {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      font-size: 10px;
    }

    .spec-tag {
      background: rgba(102, 126, 234, 0.2);
      padding: 3px 6px;
      border-radius: 3px;
      color: #64b5f6;
    }

    .product-price {
      font-size: 18px;
      font-weight: 900;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .product-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .qty-control {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      border: 1px solid rgba(100, 150, 200, 0.2);
    }

    .qty-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      color: #64b5f6;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: 0.2s;
    }

    .qty-btn:hover { color: #fff; }

    .qty-display {
      width: 30px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
    }

    .add-btn {
      flex: 1;
      padding: 8px 10px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      transition: 0.3s;
    }

    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(102, 126, 234, 0.3);
    }

    .add-btn:active { transform: scale(0.95); }

    .cart-modal {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(10px);
      border-left: 1px solid rgba(100, 150, 200, 0.2);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      transition: right 0.3s ease;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.3);
    }

    .cart-modal.active { right: 0; }

    .cart-header {
      padding: 16px;
      border-bottom: 1px solid rgba(100, 150, 200, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h2 {
      font-size: 18px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .close-cart {
      font-size: 22px;
      cursor: pointer;
      color: #64748b;
      transition: 0.2s;
    }

    .close-cart:hover { color: #fff; }

    .cart-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .cart-item {
      background: rgba(30, 41, 59, 0.5);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid rgba(100, 150, 200, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: bold; margin-bottom: 3px; }
    .cart-item-detail { color: #94a3b8; font-size: 11px; margin-bottom: 3px; }
    .cart-item-price { color: #64b5f6; font-weight: bold; }

    .cart-item-remove {
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
      border: 1px solid rgba(255, 107, 107, 0.3);
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      transition: 0.2s;
    }

    .cart-item-remove:hover { background: rgba(255, 107, 107, 0.3); }

    .empty-cart {
      text-align: center;
      padding: 50px 20px;
      color: #64748b;
    }

    .empty-cart-icon { font-size: 40px; margin-bottom: 10px; }

    .cart-footer {
      padding: 16px;
      border-top: 1px solid rgba(100, 150, 200, 0.2);
      background: rgba(30, 41, 59, 0.8);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .cart-total-value {
      font-size: 20px;
      font-weight: 900;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .checkout-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
    }

    .checkout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .order-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(10px);
      padding: 35px 25px;
      border-radius: 18px;
      border: 1px solid rgba(100, 150, 200, 0.2);
      text-align: center;
      z-index: 2000;
      max-width: 380px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s;
    }

    .order-modal.show { transform: translate(-50%, -50%) scale(1); }

    .order-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 1500;
    }

    .order-modal-overlay.show { display: block; }

    .order-icon { font-size: 42px; margin-bottom: 12px; }
    .order-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00ff88, #00dd77);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .order-text { color: #94a3b8; margin-bottom: 15px; font-size: 13px; line-height: 1.5; }

    .order-items {
      background: rgba(30, 41, 59, 0.5);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: left;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid rgba(100, 150, 200, 0.1);
      font-size: 12px;
    }

    .order-item-line {
      padding: 6px 0;
      border-bottom: 1px solid rgba(100, 150, 200, 0.1);
      display: flex;
      justify-content: space-between;
    }

    .order-item-line:last-child { border-bottom: none; }

    .order-price {
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 15px;
    }

    .order-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00ff88, #00dd77);
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
    }

    .order-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 255, 136, 0.3);
    }

    @media (max-width: 768px) {
      .products-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .cart-modal { max-width: 100%; }
      .navbar { gap: 8px; }
      .search-container { min-width: 150px; }
    }
  </style>
</head>

        engine,
        power
      });

    let cart = [];
    let filteredCars = [...allCars];

    allCars.forEach((car, i) => quantities[i] = 1);

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      if (filteredCars.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">❌ Mashina topilmadi</div>';
        return;
      }
      grid.innerHTML = filteredCars.map((car, idx) => `
        <div class="product-card">
          <div class="product-image">
            🚗
            <span class="product-badge">${car.year}</span>
          </div>
          <div class="product-body">

            <div class="product-name">${car.model}</div>
            <div class="product-details">${car.type} | ${car.engine}</div>

            <div class="product-controls">

                <button class="qty-btn" onclick="decreaseQty(${idx})">−</button>
                <div class="qty-display" id="qty-${idx}">1</div>
                <button class="qty-btn" onclick="increaseQty(${idx})">+</button>
              </div>
              <button class="add-btn" onclick="addToCart(${idx})">Savat</button>
            </div>
          </div>
        </div>
      `).join('');

    function increaseQty(idx) { quantities[idx]++; document.getElementById(`qty-${idx}`).textContent = quantities[idx]; }
    function decreaseQty(idx) { if (quantities[idx] > 1) quantities[idx]--; document.getElementById(`qty-${idx}`).textContent = quantities[idx]; }

    function addToCart(idx) {
      const car = filteredCars[idx];
      const qty = quantities[idx];
      const existing = cart.find(item => item.brand === car.brand && item.model === car.model);
      
      if (existing) {
        existing.quantity += qty;
      } else {
        cart.push({...car, quantity: qty});
      }
      
      updateCart();
      quantities[idx] = 1;
      document.getElementById(`qty-${idx}`).textContent = 1;
    }

    function updateCart() {
      document.getElementById('cartCount').textContent = cart.length;
      const cartContent = document.getElementById('cartContent');
      
      if (cart.length === 0) {
        cartContent.innerHTML = '<div class="empty-cart"><div class="empty-cart-icon">🛒</div><p>Savat bo\'sh</p></div>';
        return;
      }
      
      cartContent.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.brand} ${item.model}</div>
            <div class="cart-item-detail">${item.year} | ${item.type}</div>
            <div class="cart-item-price">$${item.price.toLocaleString()} × ${item.quantity}</div>
          </div>
          <button class="cart-item-remove" onclick="removeFromCart('${item.brand}','${item.model}')">❌</button>
        </div>
      `).join('');
      
      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      document.getElementById('cartTotal').textContent = '$' + total.toLocaleString();
    }

    function removeFromCart(brand, model) {
      cart = cart.filter(item => !(item.brand === brand && item.model === model));
      updateCart();
    }

    function toggleCart() {
      document.getElementById('cartModal').classList.toggle('active');
    }

    function checkout() {
      if (cart.length === 0) {
        alert('❌ Savat bo\'sh!');
        return;
      }
      
      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      document.getElementById('orderItems').innerHTML = cart.map((item, i) => `
        <div class="order-item-line">
          <span>${i+1}. ${item.brand} ${item.model}</span>
          <span>$${(item.price * item.quantity).toLocaleString()}</span>
        </div>
      `).join('');
      
      document.getElementById('orderPrice').textContent = '$' + total.toLocaleString();
      document.getElementById('orderOverlay').classList.add('show');
      document.getElementById('orderModal').classList.add('show');
      
      setTimeout(() => {
        cart = [];
        updateCart();
        toggleCart();
      }, 3000);
    }

    function closeOrder() {
      document.getElementById('orderModal').classList.remove('show');
      document.getElementById('orderOverlay').classList.remove('show');
    }

    function filterCars() {
      const brand = document.getElementById('brandFilter').value;
      const year = document.getElementById('yearFilter').value;
      const price = parseInt(document.getElementById('priceFilter').value) || Infinity;
      const type = document.getElementById('typeFilter').value;
      
      filteredCars = allCars.filter(car =>
        (!brand || car.brand === brand) &&
        (!year || car.year == year) &&
        car.price <= price &&
        (!type || car.type === type)
      );
      
      renderProducts();
    }

    function searchCars() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      filteredCars = allCars.filter(car =>
        car.brand.toLowerCase().includes(query) ||

      );
      renderProducts();
    }
